  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="assets/main.js" defer></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <audio id="bgMusic" loop preload="auto"></audio>
  <script>
    const playlist = [
      { title: "Chuyện Để Dành (Gốc)", src: "https://cldup.com/8ogyw5uhR6.mp3" },
      { title: "Chuyện Để Dành (Mỹ Tâm Live)", src: "https://www.youtube.com/watch?v=V_YhGVnEGf8" },
      { title: "Chuyện Để Dành (Cover)", src: "https://www.youtube.com/watch?v=GPHtOHl0OJQ" }
    ];

    let currentTrack = 0;
    const audioPlayer = document.getElementById('bgMusic');

    function playNext() {
      currentTrack = (currentTrack + 1) % playlist.length;
      audioPlayer.src = playlist[currentTrack].src;
      audioPlayer.play().catch(e => console.log("Đợi tương tác..."));
    }

    audioPlayer.src = playlist[0].src;
    audioPlayer.addEventListener('ended', playNext);

    // Kích hoạt nhạc ngay khi người dùng chạm/click vào trang
    function startMusic() {
      audioPlayer.play().then(() => {
        document.removeEventListener('click', startMusic);
        document.removeEventListener('scroll', startMusic);
      }).catch(e => console.log("Chờ người dùng tương tác"));
    }
    document.addEventListener('click', startMusic, { once: true });
    document.addEventListener('scroll', startMusic, { once: true });
  </script>

  </body>
</html>
