  <audio id="bgMusic" loop preload="auto"></audio>
  <script>
    const playlist = [
      { title: "Chuyện Để Dành (Gốc)", src: "https://cldup.com/8ogyw5uhR6.mp3" },
      { title: "Chuyện Để Dành (Cover)", src: "https://www.youtube.com/watch?v=GPHtOHl0OJQ" }
    ];
    let currentTrack = 0;
    const audioPlayer = document.getElementById('bgMusic');

    function playNext() {
      currentTrack = (currentTrack + 1) % playlist.length;
      audioPlayer.src = playlist[currentTrack].src;
      audioPlayer.play().catch(e => console.log("Chờ tương tác"));
    }

    // Khởi tạo bài đầu
    audioPlayer.src = playlist[0].src;
    audioPlayer.addEventListener('ended', playNext);

    // Tự động phát sau khi tương tác lần đầu
    document.addEventListener('click', function musicAutoPlay() {
      if (audioPlayer.paused) { audioPlayer.play().catch(e => console.log("Autoplay bị chặn")); }
      document.removeEventListener('click', musicAutoPlay);
    }, { once: true });

    // Nút điều khiển (Bật/Tắt)
    document.getElementById('musicBtn').addEventListener('click', () => {
      if (audioPlayer.paused) audioPlayer.play();
      else audioPlayer.pause();
    });
  </script>
